# Apply only after exact-SHA approval, protected artifact installation and recovery gates.
# Combine with the existing project Compose files; no replacement library/config mounts.
services:
  audiobookshelf:
    # Pinned ABS image already uses tini as PID1; preserve its entrypoint.
    cpus: 2.0
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      FFPROBE_PATH: /opt/bigbrain/bounded-ffprobe.cjs
    volumes:
      - type: bind
        source: ${BB158_FFPROBE_WRAPPER:?Set the approved root-owned wrapper file path}
        target: /opt/bigbrain/bounded-ffprobe.cjs
        read_only: true
        bind:
          create_host_path: false
