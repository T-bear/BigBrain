server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location ^~ /api/v1/modules/finance/ {
        # Blocks the observed Media -> host-published Web -> Finance path.
        # Check gateway mapping before deployment: host-originating browser
        # traffic may share this source IP and can be affected.
        if ($remote_addr = ${MEDIA_FINANCE_DENIED_GATEWAY}) {
            return 403;
        }

        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
