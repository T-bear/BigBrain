name: bigbrain-sprint1

services:
  api:
    build:
      context: .
      dockerfile: src/BigBrain.Api/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      Media__TimeoutSeconds: ${MEDIA__TIMEOUTSECONDS:-3}
      Media__Jellyfin__BaseUrl: ${MEDIA__JELLYFIN__BASEURL:-http://jellyfin:8096}
      Media__Jellyfin__ApiKey: ${MEDIA__JELLYFIN__APIKEY:-}
      Media__Sonarr__BaseUrl: ${MEDIA__SONARR__BASEURL:-http://sonarr:8989}
      Media__Sonarr__ApiKey: ${MEDIA__SONARR__APIKEY:-}
      Media__Radarr__BaseUrl: ${MEDIA__RADARR__BASEURL:-http://radarr:7878}
      Media__Radarr__ApiKey: ${MEDIA__RADARR__APIKEY:-}
      Media__Prowlarr__BaseUrl: ${MEDIA__PROWLARR__BASEURL:-http://prowlarr:9696}
      Media__Prowlarr__ApiKey: ${MEDIA__PROWLARR__APIKEY:-}
      Media__QBittorrent__BaseUrl: ${MEDIA__QBITTORRENT__BASEURL:-http://qbittorrent:8080}
      Media__QBittorrent__ApiKey: ${MEDIA__QBITTORRENT__APIKEY:-}
    networks:
      - default
      - media
    ports:
      - "18080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "/bin/bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/BigBrain.Web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "13000:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  media:
    name: ${MEDIA_DOCKER_NETWORK:-bigbrain_default}
    external: true
