name: bigbrain-sprint1

services:
  api:
    build:
      context: .
      dockerfile: src/BigBrain.Api/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "18080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "/bin/bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/BigBrain.Web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "13000:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
