name: bigbrain-sprint1

services:
  sentinel:
    build:
      context: .
      dockerfile: src/BigBrain.Sentinel/Dockerfile
    environment:
      SentinelProtocol__Enabled: "true"
      SentinelProtocol__NodeId: node:local
      SentinelProtocol__SocketPath: /run/bigbrain/sentinel.sock
      SentinelProtocol__ServerCertificatePath: /run/bigbrain/identity/server-identity.p12
      SentinelProtocol__TrustedClientCertificatePath: /run/bigbrain/identity/client-trust.p12
      SentinelProtocol__ProofPublicKeyPath: /run/bigbrain/identity/proof-public.pem
      SentinelProtocol__ProofKeyId: local-control-plane
      SentinelProtocol__Filesystems__0__FilesystemId: bigbrain
      SentinelProtocol__Filesystems__0__DisplayName: BigBrain Storage
      SentinelProtocol__Filesystems__0__SentinelPath: /var/lib/bigbrain/filesystems/bigbrain
    volumes:
      - sentinel-runtime:/run/bigbrain
      - ./.sentinel/server:/run/bigbrain/identity:ro
      - ./.sentinel/storage-probes/bigbrain:/var/lib/bigbrain/filesystems/bigbrain:ro
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "test -S /run/bigbrain/sentinel.sock"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/BigBrain.Api/Dockerfile
    depends_on:
      sentinel:
        condition: service_healthy
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      Calendar__DatabasePath: /calendar-data/calendar.db
      Settings__DatabasePath: /settings-data/settings.db
      Finance__Eodhd__Enabled: ${FINANCE__EODHD__ENABLED:-false}
      Finance__Eodhd__AccountActive: ${FINANCE__EODHD__ACCOUNTACTIVE:-false}
      Finance__Eodhd__ApiToken: ${FINANCE__EODHD__APITOKEN:-}
      Finance__Eodhd__DatabasePath: /finance-data/eodhd-market-memory.db
      Finance__Eodhd__PayloadDirectory: /finance-data/eodhd-payloads
      Finance__Datasets__QuarantineDirectory: /finance-data/dataset-quarantine
      Finance__DataProtection__BackupDirectory: /finance-data/backups
      Finance__DataProtection__RestoreStagingDirectory: /finance-data/restore-staging
      Finance__Eodhd__EntitlementEndsAtUtc: ${FINANCE__EODHD__ENTITLEMENTENDSATUTC:-}
      Finance__Fred__Enabled: ${FINANCE__FRED__ENABLED:-false}
      Finance__Fred__ApiKey: ${FINANCE__FRED__APIKEY:-}
      Finance__Fred__BaseUrl: https://api.stlouisfed.org
      Finance__Fred__QuarantineDirectory: /finance-data/macro-quarantine
      Finance__ResearchScheduler__Enabled: ${FINANCE__RESEARCHSCHEDULER__ENABLED:-false}
      Finance__ResearchOperations__MaintenancePaused: ${FINANCE__RESEARCHOPERATIONS__MAINTENANCEPAUSED:-false}
      SystemRecovery__DatabasePath: /lifecycle-data/lifecycle.db
      SystemRecovery__ClockSyncDirectory: /host-timesync
      MealPlanner__DatabasePath: /data/meal-planner.db
      ShoppingList__DatabasePath: /shopping-data/shopping-list.db
      Sentinel__Enabled: "true"
      Sentinel__NodeId: node:local
      Sentinel__SocketPath: /run/bigbrain/sentinel.sock
      Sentinel__ClientCertificatePath: /run/bigbrain/identity/client-identity.p12
      Sentinel__TrustedServerCertificatePath: /run/bigbrain/identity/server-trust.p12
      Sentinel__ProofPrivateKeyPath: /run/bigbrain/identity/proof-private.pem
      Sentinel__ProofKeyId: local-control-plane
      Media__TimeoutSeconds: ${MEDIA__TIMEOUTSECONDS:-3}
      Media__Requests__Enabled: ${MEDIA__REQUESTS__ENABLED:-true}
      Media__Requests__DefaultSearchAfterAdd: ${MEDIA__REQUESTS__DEFAULTSEARCHAFTERADD:-false}
      Media__Requests__PreviewTokenLifetimeMinutes: ${MEDIA__REQUESTS__PREVIEWTOKENLIFETIMEMINUTES:-5}
      Media__Requests__MaximumConcurrentRequests: ${MEDIA__REQUESTS__MAXIMUMCONCURRENTREQUESTS:-1}
      Media__Jellyfin__BaseUrl: ${MEDIA__JELLYFIN__BASEURL:-http://jellyfin:8096}
      Media__Jellyfin__ApiKey: ${MEDIA__JELLYFIN__APIKEY:-}
      Media__Jellyfin__UserId: ${MEDIA__JELLYFIN__USERID:-}
      Media__SmartShuffle__Enabled: ${MEDIA__SMARTSHUFFLE__ENABLED:-false}
      Media__SmartShuffle__RequestTimeoutSeconds: ${MEDIA__SMARTSHUFFLE__REQUESTTIMEOUTSECONDS:-15}
      Media__SmartShuffle__PlaybackConfirmationSeconds: ${MEDIA__SMARTSHUFFLE__PLAYBACKCONFIRMATIONSECONDS:-20}
      Media__Sonarr__BaseUrl: ${MEDIA__SONARR__BASEURL:-http://sonarr:8989}
      Media__Sonarr__ApiKey: ${MEDIA__SONARR__APIKEY:-}
      Media__Radarr__BaseUrl: ${MEDIA__RADARR__BASEURL:-http://radarr:7878}
      Media__Radarr__ApiKey: ${MEDIA__RADARR__APIKEY:-}
      Media__Prowlarr__BaseUrl: ${MEDIA__PROWLARR__BASEURL:-http://prowlarr:9696}
      Media__Prowlarr__ApiKey: ${MEDIA__PROWLARR__APIKEY:-}
      Media__Audiobookshelf__BaseUrl: ${MEDIA__AUDIOBOOKSHELF__BASEURL:-http://audiobookshelf:80}
      Media__Audiobookshelf__ApiKey: ${MEDIA__AUDIOBOOKSHELF__APIKEY:-}
      Media__Audiobookshelf__LibraryId: ${MEDIA__AUDIOBOOKSHELF__LIBRARYID:-}
      Media__Audiobookshelf__PublicUrl: ${MEDIA__AUDIOBOOKSHELF__PUBLICURL:-}
      Media__Audiobookshelf__PageSize: ${MEDIA__AUDIOBOOKSHELF__PAGESIZE:-24}
      Media__QBittorrent__BaseUrl: ${MEDIA__QBITTORRENT__BASEURL:-http://qbittorrent:8080}
      Media__QBittorrent__ApiKey: ${MEDIA__QBITTORRENT__APIKEY:-}
      Media__ServiceLinks__Jellyfin__Url: ${MEDIA__SERVICELINKS__JELLYFIN__URL:-}
      Media__ServiceLinks__Jellyfin__Enabled: ${MEDIA__SERVICELINKS__JELLYFIN__ENABLED:-false}
      Media__ServiceLinks__Radarr__Url: ${MEDIA__SERVICELINKS__RADARR__URL:-}
      Media__ServiceLinks__Radarr__Enabled: ${MEDIA__SERVICELINKS__RADARR__ENABLED:-false}
      Media__ServiceLinks__Sonarr__Url: ${MEDIA__SERVICELINKS__SONARR__URL:-}
      Media__ServiceLinks__Sonarr__Enabled: ${MEDIA__SERVICELINKS__SONARR__ENABLED:-false}
      Media__ServiceLinks__Prowlarr__Url: ${MEDIA__SERVICELINKS__PROWLARR__URL:-}
      Media__ServiceLinks__Prowlarr__Enabled: ${MEDIA__SERVICELINKS__PROWLARR__ENABLED:-false}
      Media__ServiceLinks__QBittorrent__Url: ${MEDIA__SERVICELINKS__QBITTORRENT__URL:-}
      Media__ServiceLinks__QBittorrent__Enabled: ${MEDIA__SERVICELINKS__QBITTORRENT__ENABLED:-false}
    volumes:
      - sentinel-runtime:/run/bigbrain
      - ./.sentinel/client:/run/bigbrain/identity:ro
      - meal-planner-data:/data
      - shopping-list-data:/shopping-data
      - calendar-data:/calendar-data
      - settings-data:/settings-data
      - finance-market-data:/finance-data
      - lifecycle-data:/lifecycle-data
      - /run/systemd/timesync:/host-timesync:ro
    networks:
      - default
      - media
    ports:
      - "18080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "/bin/bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 35s

  web:
    build:
      context: .
      dockerfile: src/BigBrain.Web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "13000:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.36.0
    environment:
      TZ: ${TZ:-Europe/Stockholm}
    volumes:
      - audiobookshelf-config:/config
      - audiobookshelf-metadata:/metadata
      - ${AUDIOBOOKS_LIBRARY_PATH:-/srv/media/audiobooks}:/audiobooks
    networks:
      - media
    ports:
      - "127.0.0.1:${AUDIOBOOKSHELF_PORT:-13378}:80"
    restart: unless-stopped
    stop_grace_period: 30s

  flaresolverr:
    image: flaresolverr/flaresolverr:v3.5.0
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
    networks:
      - media
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8191/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 15s

networks:
  media:
    name: ${MEDIA_DOCKER_NETWORK:-bigbrain_default}
    external: true

volumes:
  sentinel-runtime:
  meal-planner-data:
  shopping-list-data:
  calendar-data:
  settings-data:
  finance-market-data:
  lifecycle-data:
  audiobookshelf-config:
  audiobookshelf-metadata:
